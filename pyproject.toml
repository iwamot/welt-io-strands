[project]
name = "welt-io-strands"
dynamic = ["version"]
description = "The Strands Agents (Python) adapter for Welt's wire contract"
readme = "README.md"
# Floor is the oldest Python AgentCore Runtime runs an agent on; nothing below
# the runtime is supported.
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Takashi Iwamoto" }]
keywords = ["welt", "slack", "agentcore", "bedrock", "strands"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    # Not imported: this package reads the shapes Strands produces rather
    # than the SDK itself. Declared anyway, because the two are always run
    # together and this is the only place the supported floor can be
    # stated. 1.13.0 is where `strands.interrupt` arrived, and the
    # interrupts this adapter carries need it; the test suite passes from
    # there up.
    "strands-agents>=1.13.0",
]

[project.urls]
Repository = "https://github.com/iwamot/welt-io-strands"
Issues = "https://github.com/iwamot/welt-io-strands/issues"

# The dev group is included by `uv sync` and `uv run` by default, and —
# unlike a dev extra — is not published in the wheel metadata.
[dependency-groups]
dev = [
    # examples/agent is a standalone deployable; its dependencies are
    # installed here so lint and type checks cover it against the local
    # library.
    "bedrock-agentcore==1.20.0",
    # compatibility.sh reads the declared floors with it. Pinned even though it
    # arrives through pytest, so CI names the version it uses.
    "packaging==26.3",
    "pip-licenses==5.5.5",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "strands-agents==1.50.2",
    "strands-agents-tools==0.8.5",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/welt_io_strands/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/welt_io_strands"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.codecov.yml",
    "/.github",
    "/compatibility.sh",
    "/examples",
    "/mise.toml",
    "/uv.lock",
    "/validate.sh",
]

[tool.uv]
exclude-newer = "1 day"

[tool.uv.audit]
# Check the locked packages against OSV malware advisories before any sync
# installs them, so a compromised release cannot run its install hooks here.
malware-check = true

[tool.ruff]
include = ["*.py", "examples/**/*.py", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Reference: https://pydevtools.com/handbook/how-to/how-to-configure-recommended-ruff-defaults/
extend-select = [
    "F",    # Pyflakes rules
    "W",    # PyCodeStyle warnings
    # "E",    # PyCodeStyle errors
    "I",    # Sort imports properly
    "UP",   # Warn if certain things can changed due to newer Python versions
    "C4",   # Catch incorrect use of comprehensions, dict, list, etc
    "FA",   # Enforce from __future__ import annotations
    "ISC",  # Good use of string concatenation
    "ICN",  # Use common import conventions
    "RET",  # Good return practices
    # "SIM",  # Common simplification rules
    "TID",  # Some good import practices
    # "TC",   # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",  # Use pathlib instead of os.path
    "TD",   # Be diligent with TODO comments
    # "NPY",  # Some numpy-specific things
    # Not in the reference URL
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101",  # Allow assert in tests (pytest standard practice)
]

[tool.ty.src]
include = ["examples", "src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["welt_io_strands"]
branch = true

[tool.coverage.report]
show_missing = true
